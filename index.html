<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Suma fácil</title>
</head>
<body>
	<h1>Suma fácil</h1>
	<label for="numero1">Primer número:</label>
	<input type="number" id="numero1" value="0">
	<label for="numero2">Segundo número:</label>
	<input type="number" id="numero2" value="0">
	<button type="button" onclick="sumar()">Sumar</button>
	<p>Resultado: <output id="resultado">0</output></p>

	<script>
		function sumar() {
			const numero1 = Number(document.getElementById('numero1').value);
			const numero2 = Number(document.getElementById('numero2').value);
			document.getElementById('resultado').textContent = numero1 + numero2;
		}
	</script>
</body>
</html>
